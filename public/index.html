<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensajero WebRTC</title>
  </head>
  <body>
    <h1 id="titulo">Mensajero</h1>
    <p id="estado" role="status">Conectando…</p>
    <p id="presencia" role="status">Consultando presencia…</p>
    <button id="conectar" type="button" disabled>Conectar chat WebRTC</button>
    <p id="estadoRtc" role="status">Chat WebRTC pendiente.</p>

    <form id="formulario">
      <label for="mensaje">Mensaje</label>
      <input id="mensaje" maxlength="1000" autocomplete="off" required>
      <button id="enviar" disabled>Enviar</button>
    </form>

    <ul id="historial" aria-live="polite"></ul>

    <section aria-labelledby="tituloLlamada">
      <h2 id="tituloLlamada">Videollamada</h2>

      <p id="estadoLlamada" role="status">Sin llamada.</p>

      <button id="llamar" type="button" disabled>Llamar</button>
      <button id="aceptar" type="button" hidden>Aceptar</button>
      <button id="rechazar" type="button" hidden>Rechazar</button>
      <button id="colgar" type="button" hidden>Colgar</button>
      <button id="microfono" type="button" hidden>Silenciar micrófono</button>
      <button id="camara" type="button" hidden>Apagar cámara</button>

      <figure>
        <figcaption>Mi cámara</figcaption>
        <video id="videoLocal" autoplay muted playsinline width="280"></video>
      </figure>

      <figure>
        <figcaption>Otro participante</figcaption>
        <video id="videoRemoto" autoplay controls playsinline width="360"></video>
      </figure>
    </section>

<section aria-labelledby="tituloArchivos">
  <h2 id="tituloArchivos">Archivos</h2>

  <label for="archivo">Seleccionar archivo</label>
  <input id="archivo" type="file">
  <button id="enviarArchivo" type="button" disabled>Enviar archivo</button>
  <label>
  <input id="envioLento" type="checkbox">Ralentizar el envío para probar una interrupción</label>

  <p>
    <label for="progresoEnvio">Envío</label>
    <progress id="progresoEnvio" max="100" value="0"></progress>
    <span id="estadoEnvio" role="status">Sin envío.</span>
  </p>

  <p>
    <label for="progresoRecepcion">Recepción</label>
    <progress id="progresoRecepcion" max="100" value="0"></progress>
    <span id="estadoRecepcion" role="status">Sin recepción.</span>
  </p>

  <div id="archivosRecibidos"></div>
</section>

    <script>
      const titulo = document.querySelector("#titulo");
      const estado = document.querySelector("#estado");
      const estadoRtc = document.querySelector("#estadoRtc");
      const conectar = document.querySelector("#conectar");
      const formulario = document.querySelector("#formulario");
      const campo = document.querySelector("#mensaje");
      const enviar = document.querySelector("#enviar");
      const historial = document.querySelector("#historial");

      const url = new URL("ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(url, "mensajero-webrtc");

      let nodo;
      let par;
      let canal;
      let candidatosPendientes = [];

      function agregarLinea(texto) {
        const elemento = document.createElement("li");
        elemento.textContent = texto;
        historial.append(elemento);
      }

      function senal(type, payload = {}) {
        socket.send(JSON.stringify({ type, payload }));
      }

      function prepararCanal(nuevoCanal) {
        canal = nuevoCanal;

        canal.onopen = () => {
          estadoRtc.textContent = "Chat WebRTC conectado.";
          enviar.disabled = false;
          conectar.disabled = true;
          campo.focus();

          mostrarLlamada("libre", "Puedes iniciar una llamada.");
        };

        canal.onmessage = (evento) => {
          const mensaje = JSON.parse(evento.data);

          if (mensaje.tipo === "chat") {
            agregarLinea(`Otro usuario: ${mensaje.texto}`);
          } else if (mensaje.tipo === "llamada") {
            recibirControl(mensaje.accion);
          }
        };

        canal.onclose = () => {
          enviar.disabled = true;
          estadoRtc.textContent = "Canal cerrado. Recarga ambas pestañas para reconectar.";
          terminarLlamada("El otro participante se desconectó.");
        };
      }

      function prepararPar() {
        if (par) return;
        par = new RTCPeerConnection();
        par.ontrack = ({ track }) => {
          const video = document.querySelector("#videoRemoto");
          if (!video.srcObject) video.srcObject = new MediaStream();
          video.srcObject.addTrack(track);
        };
        par.onicecandidate = (evento) => {
          if (evento.candidate && socket.readyState === WebSocket.OPEN) {
            senal("ice", evento.candidate.toJSON());
          }
        };

        par.ondatachannel = ({ channel }) => {
  if (channel.label === "chat") prepararCanal(channel);
  if (channel.label === "archivos") prepararCanalArchivos(channel);
};

        par.onconnectionstatechange = () => {
            if (par.connectionState === "failed") {
                marcarTransferenciaInterrumpida();
                canalArchivos?.close();
                estadoRtc.textContent = "Falló la conexión. Recarga ambas pestañas.";
                enviar.disabled = true;
            }
        };
      }

      async function aplicarDescripcion(descripcion) {
        await par.setRemoteDescription(descripcion);
        for (const candidato of candidatosPendientes) {
          await par.addIceCandidate(candidato);
        }
        candidatosPendientes = [];
      }

      async function ofrecer() {
        // Solo A genera ofertas, aunque el usuario pulse el botón en B.
        if (par) return;
        prepararPar();
        par.addTransceiver("audio", { direction: "sendrecv" });
        par.addTransceiver("video", { direction: "sendrecv" });

        prepararCanal(par.createDataChannel("chat"));
        prepararCanalArchivos(par.createDataChannel("archivos", { ordered: true }));
        await par.setLocalDescription(await par.createOffer());
        senal("offer", par.localDescription.toJSON());
      }

      conectar.onclick = async () => {
        conectar.disabled = true;
        estadoRtc.textContent = "Estableciendo conexión WebRTC…";
        try {
          if (nodo === "nodo-a") await ofrecer();
          else senal("data-request");
        } catch (error) {
          estadoRtc.textContent = `Error al iniciar: ${error.message}`;
        }
      };

      async function procesar(mensaje) {
        if (mensaje.type === "presence") {
  document.querySelector("#presencia").textContent = mensaje.payload.conectado
    ? "Otro participante conectado."
    : "Otro participante desconectado.";
  return;
}

        if (mensaje.type === "aviso") {
          const prefijo = "Consola conectada a ";
          if (mensaje.texto.startsWith(prefijo)) {
            nodo = mensaje.texto.slice(prefijo.length);
            titulo.textContent = `Mensajero · ${nodo}`;
            document.title = titulo.textContent;
            estado.textContent = `Señalización conectada a ${nodo}`;
            conectar.disabled = false;
          } else {
            agregarLinea(mensaje.texto);
            estadoRtc.textContent = "Si la conexión quedó pendiente, recarga ambas pestañas.";
          }
          return;
        }

        if (mensaje.type === "data-request" && nodo === "nodo-a") {
          await ofrecer();

        } else if (mensaje.type === "offer" && nodo === "nodo-b") {
          prepararPar();
          await aplicarDescripcion(mensaje.payload);
          for (const transceptor of par.getTransceivers()) {
            transceptor.direction = "sendrecv";
          }
          await par.setLocalDescription(await par.createAnswer());
          senal("answer", par.localDescription.toJSON());

        } else if (mensaje.type === "answer" && nodo === "nodo-a" && par) {
          await aplicarDescripcion(mensaje.payload);
        } else if (mensaje.type === "ice") {
          if (par?.remoteDescription) await par.addIceCandidate(mensaje.payload);
          else candidatosPendientes.push(mensaje.payload);
        }
      }

      // Procesa cada señal después de que termine la anterior.
      let cola = Promise.resolve();
      socket.onmessage = (evento) => {
        cola = cola.then(() => procesar(JSON.parse(evento.data))).catch((error) => {
          estadoRtc.textContent = `Error de negociación: ${error.message}`;
        });
      };

      formulario.onsubmit = (evento) => {
        evento.preventDefault();
        const texto = campo.value.trim();
        if (!texto || canal?.readyState !== "open") return;

        canal.send(JSON.stringify({ tipo: "chat", texto }));
        agregarLinea(`Yo: ${texto}`);
        campo.value = "";
        campo.focus();
      };

      socket.onclose = (evento) => {
        estado.textContent = evento.reason || "Señalización desconectada.";
        conectar.disabled = true;
        document.querySelector("#presencia").textContent = "Presencia desconocida.";
      };

      const botonLlamar = document.querySelector("#llamar");
      const botonAceptar = document.querySelector("#aceptar");
      const botonRechazar = document.querySelector("#rechazar");
      const botonColgar = document.querySelector("#colgar");
      const botonMicrofono = document.querySelector("#microfono");
      const botonCamara = document.querySelector("#camara");
      const estadoLlamada = document.querySelector("#estadoLlamada");
      const videoLocal = document.querySelector("#videoLocal");

      let faseLlamada = "libre";
      let flujoLocal = null;
      let intento = 0;

      function mostrarLlamada(fase, texto) {
        if (fase === "activa" && faseLlamada !== "activa" && flujoLocal) {
          flujoLocal.getTracks().forEach((pista) => {
            pista.enabled = true;
          });
        }
        faseLlamada = fase;
        estadoLlamada.textContent = texto;

        botonLlamar.disabled = fase !== "libre" || canal?.readyState !== "open";
        botonAceptar.hidden = fase !== "entrante";
        botonRechazar.hidden = fase !== "entrante";
        botonColgar.hidden = !["preparando", "saliente", "activa"].includes(fase);
        botonMicrofono.hidden = fase !== "activa";
        botonCamara.hidden = fase !== "activa";
      }

      function enviarControl(accion) {
        if (canal?.readyState === "open") {
          canal.send(JSON.stringify({ tipo: "llamada", accion }));
        }
      }

      function terminarLlamada(texto) {
        intento++;

        if (flujoLocal) {
          flujoLocal.getTracks().forEach((pista) => pista.stop());
          flujoLocal = null;
        }

        videoLocal.srcObject = null;
        botonMicrofono.textContent = "Silenciar micrófono";
        botonCamara.textContent = "Apagar cámara";
        mostrarLlamada("libre", texto);
      }

      async function activarDispositivos() {
        const numeroIntento = ++intento;
        mostrarLlamada("preparando", "Esperando permiso para cámara y micrófono…");

        const flujo = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: true
        });

        // La otra persona pudo colgar mientras estaba abierto el aviso de permiso.
        if (numeroIntento !== intento) {
          flujo.getTracks().forEach((pista) => pista.stop());
          return false;
        }

        flujoLocal = flujo;
        videoLocal.srcObject = flujo;

        for (const pista of flujo.getTracks()) {
          if (numeroIntento !== intento) return false;

          const transceptor = par.getTransceivers().find(
            (item) => item.receiver.track.kind === pista.kind
          );
          if (!transceptor) throw new Error(`Falta la pista de ${pista.kind}.`);

          pista.enabled = false;
          await transceptor.sender.replaceTrack(pista);
        }

        return numeroIntento === intento;
      }

      async function iniciarOResponder(esRespuesta) {
        const turno = intento + 1;

        try {
          if (!(await activarDispositivos())) return;

          enviarControl(esRespuesta ? "aceptar" : "invitar");
          mostrarLlamada(
            esRespuesta ? "activa" : "saliente",
            esRespuesta ? "Llamada en curso." : "Esperando que la otra persona acepte…"
          );
        } catch (error) {
          if (intento !== turno) return;
          if (esRespuesta) enviarControl("rechazar");

          const detalle = error.name === "NotAllowedError"
            ? "Permiso de cámara o micrófono denegado."
            : `No se pudieron activar los dispositivos: ${error.message}`;

          terminarLlamada(detalle);
        }
      }

      botonLlamar.onclick = () => iniciarOResponder(false);
      botonAceptar.onclick = () => iniciarOResponder(true);

      botonRechazar.onclick = () => {
        enviarControl("rechazar");
        terminarLlamada("Llamada rechazada.");
      };

      botonColgar.onclick = () => {
        enviarControl("colgar");
        terminarLlamada("Llamada finalizada.");
      };

      botonMicrofono.onclick = () => {
        const pista = flujoLocal?.getAudioTracks()[0];
        if (!pista) return;
        pista.enabled = !pista.enabled;
        botonMicrofono.textContent = pista.enabled
          ? "Silenciar micrófono"
          : "Activar micrófono";
      };

      botonCamara.onclick = () => {
        const pista = flujoLocal?.getVideoTracks()[0];
        if (!pista) return;
        pista.enabled = !pista.enabled;
        botonCamara.textContent = pista.enabled
          ? "Apagar cámara"
          : "Activar cámara";
      };

      function recibirControl(accion) {
        if (accion === "invitar" && faseLlamada === "libre") {
          mostrarLlamada("entrante", "Llamada entrante. ¿Deseas aceptar?");
        } else if (accion === "invitar" && faseLlamada === "saliente") {
          // Ambos pulsaron Llamar y ya autorizaron sus dispositivos.
          enviarControl("aceptar");
          mostrarLlamada("activa", "Llamada en curso.");
        } else if (accion === "aceptar" && faseLlamada === "saliente") {
          mostrarLlamada("activa", "Llamada en curso.");
        } else if (accion === "rechazar") {
          terminarLlamada("La otra persona rechazó la llamada.");
        } else if (accion === "colgar") {
          terminarLlamada("La otra persona terminó la llamada.");
        }
      }


      const selectorArchivo = document.querySelector("#archivo");
const botonArchivo = document.querySelector("#enviarArchivo");
const barraEnvio = document.querySelector("#progresoEnvio");
const barraRecepcion = document.querySelector("#progresoRecepcion");
const estadoEnvio = document.querySelector("#estadoEnvio");
const estadoRecepcion = document.querySelector("#estadoRecepcion");
const recibidos = document.querySelector("#archivosRecibidos");

let canalArchivos;
let envio = null;
let recepcion = null;

function marcarTransferenciaInterrumpida() {
  if (recepcion) {
    const porcentaje = barraRecepcion.value;
    estadoRecepcion.textContent =
      `Recepción interrumpida al ${porcentaje} %. Archivo incompleto.`;
    recepcion = null;
  }

  if (envio) {
    estadoEnvio.textContent = "Envío interrumpido por desconexión.";
    envio = null;
  }

  botonArchivo.disabled = true;
}

function actualizarBotonArchivo() {
  botonArchivo.disabled =
    canalArchivos?.readyState !== "open" || !selectorArchivo.files.length || !!envio;
}

selectorArchivo.onchange = actualizarBotonArchivo;

async function calcularHash(archivo) {
  const bytes = await archivo.arrayBuffer();
  const resumen = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(resumen), (byte) =>
    byte.toString(16).padStart(2, "0")
  ).join("");
}

function esperarEspacio(canal) {
  if (canal.readyState !== "open") {
    return Promise.reject(new Error("Se cerró el canal."));
  }
  if (canal.bufferedAmount < 256 * 1024) return Promise.resolve();

  return new Promise((resolver, rechazar) => {
    function limpiar() {
      canal.removeEventListener("bufferedamountlow", continuar);
      canal.removeEventListener("close", cancelar);
    }
    function continuar() {
      limpiar();
      resolver();
    }
    function cancelar() {
      limpiar();
      rechazar(new Error("Transferencia interrumpida."));
    }
    canal.addEventListener("bufferedamountlow", continuar);
    canal.addEventListener("close", cancelar);
  });
}

botonArchivo.onclick = async () => {
  const archivo = selectorArchivo.files[0];
  if (!archivo || envio || canalArchivos?.readyState !== "open") return;

  const canal = canalArchivos;
  const id = crypto.randomUUID();
  envio = id;
  actualizarBotonArchivo();
  barraEnvio.value = 0;
  estadoEnvio.textContent = "Calculando SHA-256…";

  try {
    const hash = await calcularHash(archivo);
    const maximo = par.sctp?.maxMessageSize;
    const bloque = maximo > 0 ? Math.min(16384, maximo) : 16384;

    canal.send(JSON.stringify({
      tipo: "inicio", id, nombre: archivo.name,
      mime: archivo.type, tamano: archivo.size, hash
    }));

    const envioLento = document.querySelector("#envioLento").checked;
    let enviados = 0;
    let siguientePausa = 256 * 1024;

    while (enviados < archivo.size) {
      await esperarEspacio(canal);
      const datos = await archivo.slice(enviados, enviados + bloque).arrayBuffer();
      canal.send(datos);
      enviados += datos.byteLength;

      const porcentaje = Math.floor(100 * enviados / archivo.size);
      barraEnvio.value = porcentaje;
      estadoEnvio.textContent = `${porcentaje} % encolado`;
      if (envioLento && enviados >= siguientePausa) {
        siguientePausa += 256 * 1024;
        await new Promise((continuar) => setTimeout(continuar, 250));
    }
}

    canal.send(JSON.stringify({ tipo: "fin", id }));
    estadoEnvio.textContent = "Esperando confirmación del receptor…";
  } catch (error) {
    if (canal.readyState === "open") {
      canal.send(JSON.stringify({ tipo: "cancelar", id }));
    }
    envio = null;
    estadoEnvio.textContent = `Envío interrumpido: ${error.message}`;
    actualizarBotonArchivo();
  }
};

function mostrarArchivo(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const bloque = document.createElement("p");
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = nombre;
  enlace.textContent = `Descargar ${nombre}`;
  bloque.append(enlace);

  let vista;
  if (blob.type.startsWith("image/")) vista = document.createElement("img");
  if (blob.type.startsWith("audio/")) vista = document.createElement("audio");
  if (blob.type.startsWith("video/")) vista = document.createElement("video");

  if (vista) {
    vista.src = url;
    if (vista.tagName === "IMG") vista.alt = nombre;
    else vista.controls = true;
    vista.style.maxWidth = "320px";
    bloque.append(document.createElement("br"), vista);
  }

  recibidos.append(bloque);
}

async function recibirArchivo(datos, canal) {
  if (typeof datos !== "string") {
    if (!recepcion) return;

    recepcion.bytes += datos.byteLength;
    if (recepcion.bytes > recepcion.tamano) {
      throw new Error("Se recibieron más bytes de los anunciados.");
    }

    recepcion.partes.push(datos);
    const porcentaje = Math.floor(100 * recepcion.bytes / recepcion.tamano);
    barraRecepcion.value = porcentaje;
    estadoRecepcion.textContent = `${recepcion.nombre} · ${porcentaje} %`;
    return;
  }

  const mensaje = JSON.parse(datos);

  if (mensaje.tipo === "inicio") {
    recepcion = { ...mensaje, bytes: 0, partes: [] };
    barraRecepcion.value = 0;
    estadoRecepcion.textContent = `Recibiendo ${mensaje.nombre}…`;
    return;
  }

  if (mensaje.tipo === "cancelar" && recepcion?.id === mensaje.id) {
    recepcion = null;
    estadoRecepcion.textContent = "El emisor interrumpió la transferencia.";
    return;
  }

  if (mensaje.tipo === "fin" && recepcion?.id === mensaje.id) {
    const copia = recepcion;
    const blob = new Blob(copia.partes, { type: copia.mime });
    estadoRecepcion.textContent = "Verificando tamaño y SHA-256…";

    if (blob.size !== copia.tamano || await calcularHash(blob) !== copia.hash) {
      throw new Error("El tamaño o el SHA-256 no coincide.");
    }

    if (canal.readyState !== "open" || recepcion !== copia) return;
    mostrarArchivo(blob, copia.nombre);
    barraRecepcion.value = 100;
    estadoRecepcion.textContent = `${copia.nombre} · ${blob.size} bytes verificados`;
    canal.send(JSON.stringify({ tipo: "confirmado", id: copia.id }));
    recepcion = null;
    return;
  }

  if (mensaje.id === envio &&
      (mensaje.tipo === "confirmado" || mensaje.tipo === "error")) {
    if (mensaje.tipo === "confirmado") {
      barraEnvio.value = 100;
      estadoEnvio.textContent = "El receptor verificó el archivo.";
    } else {
      estadoEnvio.textContent = "El receptor detectó un error en el archivo.";
    }

    envio = null;
    actualizarBotonArchivo();
  }
}

function prepararCanalArchivos(canal) {
  canalArchivos = canal;
  canal.binaryType = "arraybuffer";
  canal.bufferedAmountLowThreshold = 64 * 1024;
  canal.onopen = actualizarBotonArchivo;

  // Conserva el orden incluso mientras se calcula el hash del archivo recibido.
  let cola = Promise.resolve();
  canal.onmessage = ({ data }) => {
    cola = cola.then(() => recibirArchivo(data, canal)).catch((error) => {
      if (recepcion && canal.readyState === "open") {
        canal.send(JSON.stringify({ tipo: "error", id: recepcion.id }));
      }
      recepcion = null;
      estadoRecepcion.textContent = `Recepción interrumpida: ${error.message}`;
    });
  };

  canal.onclose = marcarTransferenciaInterrumpida;

  actualizarBotonArchivo();
}

      </script>
  </body>
</html>
